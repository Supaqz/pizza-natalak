<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remix Pizza - ระบบหน้าจอ POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- หน้า Login -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border-t-8 border-orange-500">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-black text-slate-900"><i class="fa-solid fa-pizza-slice text-orange-500"></i> Remix Pizza</h1>
                <p class="text-sm text-slate-500">ระบบเข้าสู่ระบบ (POS)</p>
            </div>
            <div class="space-y-4">
                <select id="branch-select" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:border-orange-500">
                    <option value="เทอมินอล 21 โคราช">เทอมินอล 21 โคราช</option>
                    <option value="ตลาด RN Yard">ตลาด RN Yard</option>
                </select>
                <input type="text" id="username-input" placeholder="พิมพ์ชื่อพนักงาน..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:border-orange-500">
                <button onclick="login()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-md">เข้าใช้งานระบบ</button>
            </div>
        </div>
    </div>

    <!-- หน้าแอปหลัก POS -->
    <div id="main-app" class="hidden min-h-screen flex flex-col">
        <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 px-4 py-3 flex justify-between items-center">
            <h1 class="font-black text-lg"><i class="fa-solid fa-pizza-slice text-orange-500"></i> Pizza <span id="display-branch" class="text-orange-500 text-sm"></span></h1>
            <div class="text-xs font-bold bg-slate-100 px-3 py-1.5 rounded-lg">พนักงาน: <span id="display-user"></span></div>
        </header>

        <main class="flex-1 max-w-md w-full mx-auto p-4">
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
                <h2 class="font-bold text-lg border-b pb-2"><i class="fa-solid fa-calculator text-orange-500 mr-2"></i>สรุปยอดขายประจำวัน</h2>
                
                <!-- เครื่องคิดเลข POS -->
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">ยอดเงินสดในลิ้นชัก (บาท)</label>
                        <input type="number" id="pos-cash" value="0" oninput="calculateNet()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 font-bold text-lg focus:border-orange-500 text-right">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1 text-red-600">หักค่าใช้จ่าย/เบิกรายวัน (บาท)</label>
                        <input type="number" id="pos-expense" value="0" oninput="calculateNet()" class="w-full bg-red-50 border border-red-200 rounded-xl px-3 py-2 font-bold text-lg text-red-600 focus:border-red-500 text-right">
                    </div>
                </div>

                <div class="bg-emerald-600 text-white rounded-xl p-4 text-center shadow-inner mt-4">
                    <p class="text-xs font-bold opacity-80 uppercase">ยอดเงินสุทธิที่ต้องนำฝาก</p>
                    <p id="pos-net" class="text-3xl font-black mt-1">0</p>
                </div>

                <button id="save-btn" onclick="saveData()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl shadow-md mt-6 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> บันทึกยอดและส่งเข้า LINE
                </button>
            </section>
        </main>
    </div>

    <script>
        // *** สำคัญ: นำ Web App URL ของ Google Apps Script มาใส่ตรงนี้ ***
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3ExdAabjngZCfX1Qi-K44kTh6_xAd7XXWyvKFC5G3gueNbVKiQr-XnVW3ngaG34vx/exec";

        function login() {
            const user = document.getElementById('username-input').value;
            const branch = document.getElementById('branch-select').value;
            if(!user) return alert('กรุณาพิมพ์ชื่อพนักงานครับ');
            
            document.getElementById('display-user').innerText = user;
            document.getElementById('display-branch').innerText = `(${branch})`;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
        }

        function calculateNet() {
            const cash = parseFloat(document.getElementById('pos-cash').value) || 0;
            const expense = parseFloat(document.getElementById('pos-expense').value) || 0;
            document.getElementById('pos-net').innerText = (cash - expense).toLocaleString();
        }

        async function saveData() {
            const btn = document.getElementById('save-btn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึกข้อมูล...';
            btn.disabled = true;

            const cash = parseFloat(document.getElementById('pos-cash').value) || 0;
            const expense = parseFloat(document.getElementById('pos-expense').value) || 0;

            const payload = {
                date: new Date().toLocaleDateString('th-TH'),
                branch: document.getElementById('display-branch').innerText.replace(/[()]/g, ''),
                staffName: document.getElementById('display-user').innerText,
                totalCash: cash,
                expenses: expense,
                netCash: cash - expense
            };

            try {
                // ส่งเป็น text/plain เพื่อป้องกันปัญหา CORS ของ Google Apps Script
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                if (result.status === "success") {
                    alert('✅ บันทึกยอดลงตาราง และส่งสรุปเข้า LINE เรียบร้อยแล้ว!');
                    document.getElementById('pos-cash').value = 0;
                    document.getElementById('pos-expense').value = 0;
                    calculateNet();
                } else {
                    alert('❌ ผิดพลาด: ' + result.message);
                }
            } catch (error) {
                alert('❌ ขัดข้อง: ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> บันทึกยอดและส่งเข้า LINE';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
