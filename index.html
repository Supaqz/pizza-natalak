<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza หน้าทะลัก - POS System</title>
    <!-- โหลดฟอนต์ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { brand: { DEFAULT: '#FF5C00', light: '#FFF0E5', hover: '#E55300' }, bg: '#F4F6F8' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F4F6F8; -webkit-font-smoothing: antialiased; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <!-- ================= 1. หน้าจอ Login (เชื่อม Firebase แล้ว) ================= -->
    <div id="login-screen" class="fixed inset-0 bg-[#333C4A] z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[32px] p-8 md:p-10 max-w-md w-full shadow-2xl relative">
            
            <div class="flex flex-col items-center justify-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-[#FF7A00] to-[#FF5C00] text-white rounded-2xl flex items-center justify-center text-3xl shadow-lg mb-4">
                    <i class="fa-solid fa-pizza-slice -rotate-45"></i>
                </div>
                <h1 class="text-3xl font-black text-[#1A1F2B] tracking-tight">Pizza หน้าทะลัก</h1>
                <p class="text-sm text-slate-500 mt-1">ระบบลงทะเบียนเข้าปฏิบัติงานและสรุปยอดเงินสดประจำวัน</p>
            </div>

            <div class="space-y-6">
                <!-- สาขา -->
                <div>
                    <label class="block text-sm font-bold text-slate-800 mb-3"><i class="fa-solid fa-shop text-brand mr-1"></i> 1. เลือกสาขาที่จะเข้าปฏิบัติงาน <span class="text-red-500">*</span></label>
                    <div class="space-y-3">
                        <div class="border-2 border-brand bg-[#FFF6F0] rounded-xl p-4 flex items-center justify-between cursor-pointer shadow-sm">
                            <div>
                                <h4 class="font-bold text-brand flex items-center gap-2"><i class="fa-solid fa-lock"></i> สาขา เทอมินอล 21 โคราช</h4>
                                <p class="text-xs text-orange-600/80 mt-1">ชั้น 4 โซนอาหาร เทอมินอล 21 นครราชสีมา</p>
                            </div>
                            <div class="w-6 h-6 rounded-full bg-brand text-white flex items-center justify-center shrink-0"><i class="fa-solid fa-check text-xs"></i></div>
                        </div>
                    </div>
                </div>

                <!-- ข้อมูลพนักงาน -->
                <div>
                    <label class="block text-sm font-bold text-slate-800 mb-3"><i class="fa-regular fa-user text-brand mr-1"></i> 2. กรอกข้อมูลพนักงาน / ผู้เข้าใช้งาน <span class="text-red-500">*</span></label>
                    <div class="space-y-3">
                        <div>
                            <div class="relative">
                                <i class="fa-regular fa-user absolute left-4 top-3.5 text-slate-400"></i>
                                <input type="text" id="nickname-input" placeholder="ชื่อเล่น เช่น น้องส้ม, แอดมินตั้ม" class="w-full bg-white border border-slate-300 rounded-xl pl-10 pr-4 py-3 text-sm focus:border-brand outline-none transition-colors">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ปุ่ม Login ธรรมดา -->
                <button onclick="manualLogin()" class="w-full bg-gradient-to-r from-[#FF7A00] to-[#FF5C00] hover:shadow-lg hover:shadow-orange-500/30 text-white font-bold py-3.5 rounded-xl transition-all flex items-center justify-center gap-2 text-[15px]">
                    เข้าใช้งานระบบ <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div class="relative flex items-center py-2">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink-0 mx-4 text-slate-400 text-xs">หรือล็อกอินด้วย Google</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <!-- ปุ่ม Google Login -->
                <button id="btn-google-login" class="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold py-3.5 rounded-xl transition-colors flex items-center justify-center gap-3 text-sm shadow-sm">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                    เข้าสู่ระบบด้วย Google (ดึงอีเมลอัตโนมัติ)
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 2. แอปพลิเคชันหลัก (Main App Wrapper) ================= -->
    <div id="main-app" class="hidden flex-col flex-1 w-full relative">
        <!-- 
            [ให้นำโค้ด <header> และ <main> (หน้าสต๊อก และ หน้าสรุปยอด) ที่ผมเคยส่งให้ มาวางต่อกันตรงนี้ได้เลยครับ] 
        -->
        
        <!-- ตัวอย่างปุ่ม Logout (วางไว้ชั่วคราวให้กดทดสอบ) -->
        <div class="p-10 text-center">
            <h2 class="text-2xl font-bold mb-4">ยินดีต้อนรับสู่ระบบ Pizza หน้าทะลัก</h2>
            <p id="display-user-info" class="text-slate-600 mb-6">กำลังโหลดข้อมูลผู้ใช้...</p>
            <button id="btn-logout" class="bg-red-500 text-white px-6 py-2 rounded-xl font-bold hover:bg-red-600">ออกจากระบบ</button>
        </div>
    </div>

    <!-- ================= 3. ระบบ Firebase & Logic ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Config ของโปรเจกต์ Pizza Natalak
        const firebaseConfig = {
  apiKey: "AIzaSyAyVBpIvoy9d0BnYaP6OU30u6kfe6lMuqs",
  authDomain: "pizza-natalak.firebaseapp.com",
  projectId: "pizza-natalak",
  storageBucket: "pizza-natalak.firebasestorage.app",
  messagingSenderId: "78990099997",
  appId: "1:78990099997:web:fd7df10a43f179e192a8f4",
  measurementId: "G-SR22WE99W0"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // ฟังก์ชันเมื่อกดปุ่ม Google Login
        document.getElementById('btn-google-login').addEventListener('click', () => {
            const btn = document.getElementById('btn-google-login');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-slate-400"></i> กำลังเชื่อมต่อ...';
            
            signInWithPopup(auth, provider).then((result) => {
                const user = result.user;
                saveSession(user.displayName, user.email, user.photoURL, "Admin");
            }).catch((error) => {
                console.error("Login Failed:", error);
                alert("เกิดข้อผิดพลาดในการล็อกอิน: " + error.message);
                btn.innerHTML = '<img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"> เข้าสู่ระบบด้วย Google';
            });
        });

        // ฟังก์ชัน Login แบบธรรมดา (พิมพ์ชื่อเอง)
        window.manualLogin = function() {
            const nickname = document.getElementById('nickname-input').value.trim();
            if(!nickname) return alert("กรุณาระบุชื่อพนักงานครับ");
            
            const role = nickname.toLowerCase() === 'admin' ? 'Admin' : 'Staff';
            saveSession(nickname, "ไม่ระบุอีเมล", "", role);
        };

        // ฟังก์ชันบันทึก Session และเปิดหน้าแอป
        function saveSession(name, email, photo, role) {
            const sessionData = {
                nickname: name || "พนักงาน",
                email: email,
                photo: photo || "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix",
                role: role,
                branch: "สาขา เทอมินอล 21 โคราช"
            };
            localStorage.setItem('pizza_session', JSON.stringify(sessionData));
            showMainApp(sessionData);
        }

        // ฟังก์ชันสลับหน้าจอไปหน้าหลัก
        function showMainApp(userData) {
            document.getElementById('login-screen').classList.add('hidden');
            const mainApp = document.getElementById('main-app');
            mainApp.classList.remove('hidden');
            mainApp.classList.add('flex');
            
            // อัปเดตข้อมูลบนหน้าจอ (ตัวอย่าง)
            const display = document.getElementById('display-user-info');
            if(display) {
                display.innerHTML = `เข้าสู่ระบบโดย: <b>${userData.nickname}</b> <br> สิทธิ์: ${userData.role} <br> อีเมล: ${userData.email}`;
            }
        }

        // ฟังก์ชัน Logout
        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => {
                localStorage.removeItem('pizza_session');
                document.getElementById('main-app').classList.add('hidden');
                document.getElementById('main-app').classList.remove('flex');
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('btn-google-login').innerHTML = '<img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"> เข้าสู่ระบบด้วย Google';
            });
        });

        // เช็ค Session ตอนโหลดเว็บ (จำการล็อกอินอัตโนมัติ)
        window.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('pizza_session');
            if(session) {
                showMainApp(JSON.parse(session));
            }
        });
    </script>
    <!-- ================= 3. ระบบ Firebase & Logic หลักของแอป ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 1. Config ของ Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAyVbpIvoy9d0BnYaP6OU30u6kfe6lMuqs",
            authDomain: "pizza-natalak.firebaseapp.com",
            projectId: "pizza-natalak",
            storageBucket: "pizza-natalak.firebasestorage.app",
            messagingSenderId: "78990099997",
            appId: "1:78990099997:web:fd7df10a43f179e192a8f4"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // 🌟 ตั้งค่าอีเมลเจ้าของร้าน (แอดมิน)
        const ADMIN_EMAILS = [
            "suphachaimunsan1@gmail.com",
            "supaqz.sm@gmail.com"
        ];

        // 2. ระบบเข้าสู่ระบบ (Login Flow)
        const btnGoogleLogin = document.getElementById('btn-google-login');
        if(btnGoogleLogin) {
            btnGoogleLogin.addEventListener('click', () => {
                btnGoogleLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-slate-400"></i> กำลังเชื่อมต่อ...';
                
                signInWithPopup(auth, provider).then((result) => {
                    const user = result.user;
                    // ตรวจสอบสิทธิ์จากอีเมล
                    const role = ADMIN_EMAILS.includes(user.email) ? 'Admin' : 'Staff';
                    saveSession(user.displayName, user.email, user.photoURL, role);
                }).catch((error) => {
                    console.error("Login Failed:", error);
                    alert("เข้าสู่ระบบไม่สำเร็จ: " + error.message);
                    btnGoogleLogin.innerHTML = '<img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"> เข้าสู่ระบบด้วย Google';
                });
            });
        }

        window.manualLogin = function() {
            const nickname = document.getElementById('nickname-input').value.trim();
            if(!nickname) return alert("กรุณาระบุชื่อพนักงานครับ");
            const role = ADMIN_EMAILS.includes(nickname.toLowerCase()) || nickname.toLowerCase() === 'admin' ? 'Admin' : 'Staff';
            saveSession(nickname, "ไม่ระบุอีเมล", "", role);
        };

        function saveSession(name, email, photo, role) {
            const sessionData = {
                nickname: name || "พนักงาน",
                email: email,
                photo: photo || "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix",
                role: role,
                branch: "สาขา เทอมินอล 21 โคราช" // ค่าเริ่มต้น
            };
            localStorage.setItem('pizza_session', JSON.stringify(sessionData));
            initApp(sessionData);
        }

        // 3. เริ่มต้นแอปพลิเคชัน (Init App)
        function initApp(userData) {
            // สลับหน้าจอ
            document.getElementById('login-screen').classList.add('hidden');
            const mainApp = document.getElementById('main-app');
            mainApp.classList.remove('hidden');
            mainApp.classList.add('flex');
            
            // นำข้อมูลผู้ใช้ไปแสดงบน Header (ถ้ามี Element มารองรับ)
            // เช็คและแสดงแท็บ Admin
            const adminTabBtn = document.getElementById('tab-admin'); // ต้องตั้ง id="tab-admin" ที่ปุ่มแท็บ
            if(adminTabBtn) {
                if(userData.role === 'Admin') {
                    adminTabBtn.style.display = 'flex';
                } else {
                    adminTabBtn.style.display = 'none';
                    switchTab('stock'); // บังคับไปหน้าแรก
                }
            }
        }

        window.logout = function() {
            signOut(auth).then(() => {
                localStorage.removeItem('pizza_session');
                document.getElementById('main-app').classList.add('hidden');
                document.getElementById('main-app').classList.remove('flex');
                document.getElementById('login-screen').classList.remove('hidden');
                if(btnGoogleLogin) btnGoogleLogin.innerHTML = '<img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"> เข้าสู่ระบบด้วย Google';
            });
        };

        // 4. ระบบจัดการแท็บ (Tabs Manager)
        window.switchTab = function(tabId) {
            const tabs = ['page-stock', 'page-cash', 'page-admin'];
            tabs.forEach(t => {
                const el = document.getElementById(t);
                if(el) {
                    if(t === tabId) el.classList.remove('hidden');
                    else el.classList.add('hidden');
                }
            });
        };

        // 5. ระบบเครื่องคิดเงิน (Cash Calculator)
        window.calculateDailyCash = function() {
            const m1000 = (parseInt(document.getElementById('qty-1000')?.value) || 0) * 1000;
            const m500 = (parseInt(document.getElementById('qty-500')?.value) || 0) * 500;
            const m100 = (parseInt(document.getElementById('qty-100')?.value) || 0) * 100;
            const m50 = (parseInt(document.getElementById('qty-50')?.value) || 0) * 50;
            const m20 = (parseInt(document.getElementById('qty-20')?.value) || 0) * 20;
            const m10 = (parseInt(document.getElementById('qty-10')?.value) || 0) * 10;
            const m5 = (parseInt(document.getElementById('qty-5')?.value) || 0) * 5;
            const m2 = (parseInt(document.getElementById('qty-2')?.value) || 0) * 2;
            const m1 = (parseInt(document.getElementById('qty-1')?.value) || 0) * 1;

            if(document.getElementById('sum-1000')) document.getElementById('sum-1000').innerText = `฿${m1000.toLocaleString()}`;
            if(document.getElementById('sum-500')) document.getElementById('sum-500').innerText = `฿${m500.toLocaleString()}`;
            if(document.getElementById('sum-100')) document.getElementById('sum-100').innerText = `฿${m100.toLocaleString()}`;
            if(document.getElementById('sum-50')) document.getElementById('sum-50').innerText = `฿${m50.toLocaleString()}`;
            if(document.getElementById('sum-20')) document.getElementById('sum-20').innerText = `฿${m20.toLocaleString()}`;
            if(document.getElementById('sum-10')) document.getElementById('sum-10').innerText = `฿${m10.toLocaleString()}`;
            
            const totalCash = m1000 + m500 + m100 + m50 + m20 + m10 + m5 + m2 + m1;
            if(document.getElementById('total-actual-cash')) document.getElementById('total-actual-cash').innerText = `฿${totalCash.toLocaleString()}`;

            const deduct1 = parseInt(document.getElementById('deduct-1')?.value) || 0;
            const deduct2 = parseInt(document.getElementById('deduct-2')?.value) || 0;
            const totalDeduct = deduct1 + deduct2;

            const netCash = totalCash - totalDeduct;
            
            if(document.getElementById('net-cash-display')) document.getElementById('net-cash-display').innerText = `฿${netCash.toLocaleString()}.00`;
            if(document.getElementById('net-cash-formula')) document.getElementById('net-cash-formula').innerText = `คำนวณจาก: เงินสด (฿${totalCash.toLocaleString()}) - ยอดหัก (฿${totalDeduct.toLocaleString()})`;
        };

        // เช็ค Session อัตโนมัติเมื่อเปิดเว็บ
        window.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('pizza_session');
            if(session) {
                initApp(JSON.parse(session));
            }
            
            // ผูก Event ให้ช่องกรอกเงินคำนวณอัตโนมัติ
            const inputs = document.querySelectorAll('.cash-input, .deduct-input');
            inputs.forEach(input => {
                input.addEventListener('input', calculateDailyCash);
            });
        });
    </script>
</body>
</html>
